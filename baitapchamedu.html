<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Bài Tập Phương Trình Lượng Giác - Phân Loại</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; line-height: 1.6; font-size: 13pt; color: #000; max-width: 1100px; margin: 40px auto; padding: 0 20px; background-color: #fff; }
        h1 { text-align: center; font-size: 22pt; text-transform: uppercase; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 13pt; font-style: italic; color: #333; margin-bottom: 30px; border-bottom: 1px solid #000; padding-bottom: 10px; }
        
        .control-panel { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 30px; }
        .control-group { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        button { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        
        .exercise-container { column-count: 2; column-gap: 50px; }
        .exercise-item { margin-bottom: 20px; break-inside: avoid; display: inline-block; width: 100%; }
        .group-title { column-span: all; background: #e9ecef; color: #212529; padding: 10px 15px; border-left: 5px solid #d9534f; margin: 20px 0; font-size: 14pt; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        
        .type-box { border: none; border-bottom: 1px dashed #d9534f; background: transparent; color: #d9534f; width: 180px; margin: 0 8px; cursor: pointer; }
        
        @media print {
            .control-panel { display: none; }
            .type-box { border: none; color: #000; -webkit-appearance: none; appearance: none; }
            .chk-print { display: none; } /* Ẩn checkbox khi in */
        }
    </style>
</head>
<body>

    <h1>Danh Sách Bài Tập Phương Trình Lượng Giác</h1>
    <div class="subtitle">Phân loại và in ấn</div>

    <div class="control-panel">
        <div class="control-group">
            <input type="text" id="newTypeInput" placeholder="Nhập tên dạng toán mới...">
            <button onclick="addType()">Thêm dạng</button>
        </div>
        <div class="control-group">
            <label><input type="radio" name="viewMode" value="original" checked onchange="renderExercises()"> Thứ tự gốc</label>
            <label><input type="radio" name="viewMode" value="grouped" id="groupedRadio" onchange="renderExercises()"> Nhóm theo dạng</label>
            <button onclick="printGrouped()" style="background-color: #28a745;">In Các Dạng Đã Chọn</button>
        </div>
    </div>

    <div id="main-view"></div>

    <div id="exercise-source" style="display: none;">
        <!-- Dữ liệu gốc -->
        <div>$2\cos^2 x + 3\cos x + 1 = 0$</div>
        <div>$2\sin^2 x - 5\sin x + 2 = 0$</div>
        <div>$\tan^2 x + 3\tan x + 2 = 0$</div>
        <!-- (Đã lược bớt phần kho dữ liệu để ngắn gọn, code vẫn giữ nguyên của bạn) -->
    </div>

    <script>
        let mathTypes = ["Chưa phân loại"];
        let exercises = [];
        let selectedTypes = new Set(["Chưa phân loại"]);

        window.onload = function() {
            // Khởi tạo dữ liệu...
            const sourceDivs = document.querySelectorAll('#exercise-source > div');
            sourceDivs.forEach((el, index) => {
                exercises.push({ originalId: index + 1, htmlContent: el.innerHTML, type: "Chưa phân loại" });
            });
            renderExercises();
        };

        function toggleType(type) {
            if (selectedTypes.has(type)) selectedTypes.delete(type);
            else selectedTypes.add(type);
        }

        function renderExercises() {
            const container = document.getElementById('main-view');
            const isGrouped = document.querySelector('input[name="viewMode"]:checked').value === 'grouped';
            let html = '<div class="exercise-container">';

            if (!isGrouped) {
                exercises.forEach(ex => {
                    html += `<div class="exercise-item"><b>Bài ${ex.originalId}:</b> 
                             <select class="type-box" onchange="updateType(${ex.originalId}, this.value)">
                                ${mathTypes.map(t => `<option value="${t}" ${ex.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                             </select>
                             <span>${ex.htmlContent}</span></div>`;
                });
            } else {
                mathTypes.forEach(type => {
                    const group = exercises.filter(e => e.type === type);
                    if (group.length > 0) {
                        html += `<div class="group-title">
                                    <input type="checkbox" class="chk-print" ${selectedTypes.has(type) ? 'checked' : ''} onchange="toggleType('${type}')">
                                    Dạng: ${type}
                                 </div>`;
                        if(selectedTypes.has(type)) {
                            group.forEach((ex, i) => {
                                html += `<div class="exercise-item"><b>Bài ${i + 1}:</b> <span>${ex.htmlContent}</span></div>`;
                            });
                        }
                    }
                });
            }
            container.innerHTML = html + '</div>';
            if (window.MathJax) MathJax.typesetPromise([container]);
        }

        function updateType(id, newType) {
            exercises.find(e => e.originalId === id).type = newType;
        }

        function addType() {
            const val = document.getElementById('newTypeInput').value.trim();
            if (val && !mathTypes.includes(val)) {
                mathTypes.push(val);
                selectedTypes.add(val);
                renderExercises();
                document.getElementById('newTypeInput').value = '';
            }
        }

        function printGrouped() {
            document.getElementById('groupedRadio').checked = true;
            renderExercises();
            setTimeout(() => window.print(), 500);
        }
    </script>
</body>
</html>

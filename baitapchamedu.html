<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phân Loại Bài Tập PTLG (200 Bài)</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Times New Roman', Times, serif; line-height: 1.6; font-size: 13pt; color: #000; max-width: 1000px; margin: 40px auto; padding: 0 20px; background-color: #fff; }
        h1 { text-align: center; font-size: 22pt; text-transform: uppercase; margin-bottom: 5px; }
        .control-panel { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 30px; position: sticky; top: 10px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .control-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        button { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        
        .exercise-container { column-count: 2; column-gap: 40px; }
        .exercise-item { margin-bottom: 15px; break-inside: avoid; display: inline-block; width: 100%; }
        .group-title { column-span: all; background: #e9ecef; padding: 10px; border-left: 5px solid #d9534f; margin: 20px 0; font-size: 14pt; font-weight: bold; }
        .type-select { border: none; border-bottom: 1px dashed #d9534f; background: transparent; color: #d9534f; width: 160px; cursor: pointer; font-size: 11pt; }
        
        @media print {
            .control-panel { display: none; }
            .type-select { display: none; }
        }
    </style>
</head>
<body>

    <h1>Danh Sách Bài Tập PTLG</h1>
    
    <div class="control-panel">
        <div class="control-group">
            <input type="text" id="newTypeInput" placeholder="Nhập dạng toán mới...">
            <button onclick="addType()">Thêm dạng</button>
        </div>
        <div class="control-group">
            <label><input type="radio" name="viewMode" value="original" checked onchange="render()"> Thứ tự gốc</label>
            <label><input type="radio" name="viewMode" value="grouped" onchange="render()"> Nhóm theo dạng</label>
            <button onclick="printSelected()" style="background-color: #28a745;">In các dạng đã chọn</button>
        </div>
        <div id="filter-checkboxes" style="display:flex; flex-wrap:wrap; gap:10px; font-size: 10pt;"></div>
    </div>

    <div id="main-view" class="exercise-container"></div>

            "$\\sqrt{3}\\sin x - 3\\cos x - 2 = \\cos 2x - \\sqrt{3}\\sin 2x$", "$\\frac{\\sin^4 x + \\cos^4 x}{\\sin 2x} = \\frac{1}{2}(\\tan x + \\cot x)$", "$2\\cos 6x + 2\\cos 4x - \\sqrt{3}\\cos 2x = \\sin 2x + \\sqrt{3}$", "$\\cos^2(\\frac{\\pi}{3} + x) + \\cos^2(\\frac{\\pi}{3} - x) = \\frac{4 - \\sin x}{2}$"
        ];

        let exercises = rawData.map((d, i) => ({ id: i + 1, content: d, type: "Chưa phân loại" }));
        let mathTypes = ["Chưa phân loại"];
        let selectedGroups = new Set(["Chưa phân loại"]);

        function addType() {
            const input = document.getElementById('newTypeInput');
            const val = input.value.trim();
            if (val && !mathTypes.includes(val)) {
                mathTypes.push(val);
                selectedGroups.add(val);
                render();
                input.value = '';
            }
        }

        function render() {
            const viewMode = document.querySelector('input[name="viewMode"]:checked').value;
            const container = document.getElementById('main-view');
            const checkboxContainer = document.getElementById('filter-checkboxes');
            
            checkboxContainer.innerHTML = '';
            if (viewMode === 'grouped') {
                mathTypes.forEach(t => {
                    checkboxContainer.innerHTML += `<label><input type="checkbox" ${selectedGroups.has(t)?'checked':''} onchange="toggleGroup('${t}')"> ${t}</label>`;
                });
            }

            let html = '';
            if (viewMode === 'original') {
                exercises.forEach(ex => {
                    html += `<div class="exercise-item"><b>Bài ${ex.id}:</b> 
                             <select class="type-select" onchange="exercises[${ex.id-1}].type=this.value">
                                ${mathTypes.map(t => `<option value="${t}" ${ex.type===t?'selected':''}>${t}</option>`).join('')}
                             </select> <span>${ex.content}</span></div>`;
                });
            } else {
                mathTypes.forEach(t => {
                    if (selectedGroups.has(t)) {
                        const group = exercises.filter(e => e.type === t);
                        if (group.length > 0) {
                            html += `<div class="group-title">Dạng: ${t}</div>`;
                            group.forEach((ex, i) => {
                                html += `<div class="exercise-item"><b>Bài ${i + 1}:</b> <span>${ex.content}</span></div>`;
                            });
                        }
                    }
                });
            }
            container.innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise([container]);
        }

        function toggleGroup(t) {
            if (selectedGroups.has(t)) selectedGroups.delete(t);
            else selectedGroups.add(t);
            render();
        }

        function printSelected() {
            document.querySelector('input[value="grouped"]').checked = true;
            render();
            setTimeout(() => window.print(), 500);
        }
    </script>
</body>
</html>

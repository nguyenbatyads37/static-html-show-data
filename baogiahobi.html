<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm Sàn Gỗ</title>
    <!-- Tích hợp Tailwind CSS để làm đẹp giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tích hợp FontAwesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Tùy chỉnh loading spinner */
        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-10">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 id="header-title" class="text-2xl font-bold"><i class="fas fa-layer-group mr-2"></i> Kho Sàn Gỗ</h1>
            <button onclick="loadAllData()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-300">
                <i class="fas fa-sync-alt mr-1"></i> Làm mới
            </button>
        </div>
    </header>

    <!-- Nội dung chính -->
    <main class="container mx-auto px-4 py-8">
        
        <!-- Khu vực hiển thị Trạng thái Đang tải -->
        <div id="loading" class="flex flex-col justify-center items-center h-64">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
            <p class="text-gray-500 font-semibold text-lg">Đang kết nối AppSheet và tải dữ liệu...</p>
        </div>

        <!-- Khu vực hiển thị Lỗi (nếu có) -->
        <div id="error-message" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded shadow" role="alert">
            <p class="font-bold">Đã xảy ra lỗi!</p>
            <p id="error-text">Không thể tải dữ liệu.</p>
        </div>

        <!-- Banner Lọc Khách hàng -->
        <div id="filter-banner" class="hidden bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded mb-6 flex justify-between items-center shadow-sm">
            <div>
                <i class="fas fa-filter mr-2"></i> Đang xem kho của khách hàng: <strong id="current-customer-name" class="text-blue-900"></strong>
            </div>
            <button id="clear-filter-btn" onclick="clearFilter()" class="text-sm bg-white border border-blue-300 hover:bg-blue-100 px-3 py-1 rounded font-semibold transition">
                <i class="fas fa-times mr-1"></i> Hủy lọc
            </button>
        </div>

        <!-- Lưới hiển thị danh sách sản phẩm -->
        <div id="product-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Dữ liệu sản phẩm sẽ được tự động chèn vào đây -->
        </div>

        <!-- Thông báo Không có dữ liệu -->
        <div id="empty-state" class="hidden flex flex-col justify-center items-center h-64 text-gray-500">
            <i class="fas fa-box-open text-6xl mb-4 text-gray-300"></i>
            <p class="text-xl font-semibold">Chưa có dữ liệu nào trong bảng.</p>
        </div>

        <!-- Khu vực Danh Sách Khách Hàng -->
        <div id="customer-section-container" class="mt-16 border-t pt-8">
            <h2 class="text-2xl font-bold mb-6 text-gray-800"><i class="fas fa-users mr-2 text-blue-600"></i> Danh Sách Khách Hàng</h2>
            
            <!-- Trạng thái Đang tải Khách hàng -->
            <div id="loading-customers" class="flex flex-col justify-center items-center h-32">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8 mb-4"></div>
                <p class="text-gray-500 font-semibold text-sm">Đang tải dữ liệu khách hàng...</p>
            </div>

            <!-- Lỗi tải Khách hàng -->
            <div id="error-customers" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded shadow" role="alert">
                <p class="font-bold">Đã xảy ra lỗi!</p>
                <p id="error-text-customers">Không thể tải dữ liệu khách hàng.</p>
            </div>

            <!-- Lưới hiển thị khách hàng -->
            <div id="customer-list" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Dữ liệu khách hàng sẽ chèn vào đây -->
            </div>
            
            <!-- Không có dữ liệu khách hàng -->
            <div id="empty-customers" class="hidden flex flex-col justify-center items-center h-32 text-gray-500">
                <i class="fas fa-user-slash text-4xl mb-4 text-gray-300"></i>
                <p class="text-lg font-semibold">Chưa có khách hàng nào.</p>
            </div>
        </div>

    </main>

    <script>
        // --- CẤU HÌNH API APPSHEET ---
        const API_KEY = 'V2-uJleW-Wif8e-HRfKY-IfpGF-goA36-Dda8a-a5wLm-6bkpQ';
        const APP_ID = '056175b6-1ee3-4302-9913-9019b3939b39';
        const APP_NAME = 'San_Pham-949980069';
        
        const TABLE_NAME = 'San_Go';
        const CUSTOMER_TABLE_NAME = 'Khach_Hang';
        
        // URL Endpoint của AppSheet V2 API
        const API_URL = `https://www.appsheet.com/api/v2/apps/${APP_ID}/tables/${TABLE_NAME}/Action`;
        const CUSTOMER_API_URL = `https://www.appsheet.com/api/v2/apps/${APP_ID}/tables/${CUSTOMER_TABLE_NAME}/Action`;

        // Biến toàn cục lưu dữ liệu
        let allProducts = [];
        let currentCustomerFilter = null;
        let isSharedLink = false; // Biến kiểm tra xem có phải link gửi riêng cho khách không

        // Hàm định dạng số tiền VND
        const formatCurrency = (amount) => {
            if (!amount || isNaN(amount)) return 'Liên hệ';
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        };

        // Hàm xử lý URL Hình ảnh của AppSheet và Google Drive
        const getImageUrl = (imagePath) => {
            if (!imagePath) return 'https://placehold.co/600x400/e2e8f0/64748b?text=Chưa+có+ảnh'; // Ảnh mặc định
            
            if (imagePath.includes('drive.google.com')) {
                let fileId = '';
                const matchFileD = imagePath.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                const matchId = imagePath.match(/id=([a-zA-Z0-9_-]+)/);
                
                if (matchFileD) {
                    fileId = matchFileD[1];
                } else if (matchId) {
                    fileId = matchId[1];
                }
                
                if (fileId) {
                    return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
                }
            }

            if (imagePath.startsWith('http')) return imagePath; 
            
            const encodedPath = encodeURIComponent(imagePath);
            return `https://www.appsheet.com/template/gettablefileurl?appName=${APP_NAME}&tableName=${TABLE_NAME}&fileName=${encodedPath}`;
        };

        // Hàm chính để tải dữ liệu từ AppSheet
        async function fetchData() {
            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('product-grid');
            const errorEl = document.getElementById('error-message');
            const errorTextEl = document.getElementById('error-text');
            const emptyEl = document.getElementById('empty-state');

            loadingEl.classList.remove('hidden');
            gridEl.classList.add('hidden');
            errorEl.classList.add('hidden');
            emptyEl.classList.add('hidden');
            gridEl.innerHTML = '';

            const requestBody = {
                "Action": "Find",
                "Properties": {
                    "Locale": "vi-VN",
                    "Timezone": "Asia/Ho_Chi_Minh"
                },
                "Rows": []
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'applicationAccessKey': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`Lỗi HTTP: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();

                if (data && Array.isArray(data) && data.length > 0) {
                    allProducts = data;
                    applyCurrentFilter();
                } else {
                    allProducts = [];
                    applyCurrentFilter();
                }

            } catch (error) {
                console.error("Lỗi khi fetch API AppSheet:", error);
                errorTextEl.textContent = error.message || 'Không thể kết nối đến máy chủ AppSheet. Vui lòng kiểm tra lại cấu hình API hoặc mạng.';
                errorEl.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
            }
        }

        // Hàm render dữ liệu ra mã HTML
        function renderProducts(products) {
            const gridEl = document.getElementById('product-grid');
            let htmlContent = '';

            products.forEach(product => {
                const id = product['ID'] || product['id'] || '';
                const maHang = product['Mã hàng'] || 'Không rõ mã';
                const tonKho = product['Tồn kho'] || '0';
                const dvt = product['Đơn vị tính tồn kho'] || '';
                const giaM2 = product['Đơn giá/m2'];
                const giaThanh = product['Đơn giá/thanh'];
                const linkAnh = product['Link ảnh'] || product['Image'] || product['Ảnh'] || '';

                const hinhAnhUrl = getImageUrl(linkAnh);

                htmlContent += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300 border border-gray-100 flex flex-col">
                        <div class="relative h-48 w-full bg-gray-200">
                            <img src="${hinhAnhUrl}" alt="${maHang}" class="object-cover w-full h-full" 
                                 referrerpolicy="no-referrer"
                                 onerror="this.onerror=null; this.src='https://placehold.co/600x400/e2e8f0/64748b?text=Lỗi+Ảnh'">
                            <div class="absolute top-0 right-0 bg-blue-600 text-white px-2 py-1 m-2 rounded-md text-xs font-bold">
                                Mã: ${maHang}
                            </div>
                        </div>
                        <div class="p-5 flex-grow flex flex-col">
                            <h3 class="font-bold text-lg text-gray-800 mb-2 truncate" title="${maHang}">${maHang}</h3>
                            
                            <div class="flex items-center text-sm text-gray-600 mb-3">
                                <i class="fas fa-boxes mr-2 text-blue-500"></i>
                                <span>Tồn kho: <strong>${tonKho} ${dvt}</strong></span>
                            </div>
                            
                            <div class="mt-auto pt-3 border-t border-gray-100 grid grid-cols-2 gap-2">
                                <div>
                                    <p class="text-xs text-gray-500">Đơn giá / m²</p>
                                    <p class="font-semibold text-red-600 text-sm">${formatCurrency(giaM2)}</p>
                                </div>
                                <div>
                                    <p class="text-xs text-gray-500">Đơn giá / thanh</p>
                                    <p class="font-semibold text-red-600 text-sm">${formatCurrency(giaThanh)}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            gridEl.innerHTML = htmlContent;
        }

        // --- CÁC HÀM XỬ LÝ LỌC SẢN PHẨM THEO KHÁCH HÀNG ---
        function applyCurrentFilter() {
            const gridEl = document.getElementById('product-grid');
            const emptyEl = document.getElementById('empty-state');
            const filterBanner = document.getElementById('filter-banner');
            
            let productsToRender = allProducts;
            
            if (currentCustomerFilter) {
                // Lọc theo cột 'Khách hàng' trong bảng San_Go (hỗ trợ chuỗi có nhiều khách hàng cách nhau bằng dấu phẩy)
                productsToRender = allProducts.filter(p => {
                    const khachHangGoc = p['Khách hàng'];
                    if (!khachHangGoc) return false;
                    
                    // Chuyển thành chuỗi, tách bằng dấu phẩy và loại bỏ khoảng trắng thừa 2 đầu của từng tên
                    const danhSachKh = String(khachHangGoc).split(',').map(name => name.trim());
                    
                    // Kiểm tra xem tên khách hàng hiện tại có trong mảng vừa tách không
                    return danhSachKh.includes(currentCustomerFilter);
                });
                
                filterBanner.classList.remove('hidden');
                document.getElementById('current-customer-name').textContent = currentCustomerFilter;
                
                // Nếu là link chia sẻ cho khách, ẩn nút "Hủy lọc" và đổi tiêu đề web
                if (isSharedLink) {
                    document.getElementById('clear-filter-btn').classList.add('hidden');
                    document.getElementById('header-title').innerHTML = `<i class="fas fa-file-invoice-dollar mr-2"></i> Báo giá: ${currentCustomerFilter}`;
                    document.title = `Báo giá - ${currentCustomerFilter}`;
                } else {
                    document.getElementById('clear-filter-btn').classList.remove('hidden');
                    document.getElementById('header-title').innerHTML = `<i class="fas fa-layer-group mr-2"></i> Kho Sàn Gỗ`;
                    document.title = `Danh Sách Sản Phẩm Sàn Gỗ`;
                }

            } else {
                filterBanner.classList.add('hidden');
                document.getElementById('header-title').innerHTML = `<i class="fas fa-layer-group mr-2"></i> Kho Sàn Gỗ`;
                document.title = `Danh Sách Sản Phẩm Sàn Gỗ`;
            }

            if (productsToRender.length > 0) {
                renderProducts(productsToRender);
                gridEl.classList.remove('hidden');
                emptyEl.classList.add('hidden');
            } else {
                gridEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                if (currentCustomerFilter) {
                    emptyEl.querySelector('p').textContent = `Khách hàng "${currentCustomerFilter}" chưa có dữ liệu tồn kho.`;
                } else {
                    emptyEl.querySelector('p').textContent = `Chưa có dữ liệu nào trong bảng.`;
                }
            }
        }

        function filterByCustomer(customerName) {
            currentCustomerFilter = customerName;
            applyCurrentFilter();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearFilter() {
            currentCustomerFilter = null;
            history.pushState('', document.title, window.location.pathname + window.location.search);
            applyCurrentFilter();
        }

        function checkUrlFilter() {
            // Ưu tiên 1: Kiểm tra URL Parameter ?kh=... (Đây là link chia sẻ cho khách)
            const params = new URLSearchParams(window.location.search);
            if (params.has('kh')) {
                currentCustomerFilter = params.get('kh');
                isSharedLink = true;
                return; // Nếu là link khách, bỏ qua hash bên dưới
            }

            // Ưu tiên 2: Kiểm tra hash #khachhang=... (Dành cho chủ shop bấm Xem thử)
            const hash = decodeURIComponent(window.location.hash);
            if (hash.startsWith('#khachhang=')) {
                currentCustomerFilter = hash.replace('#khachhang=', '');
                isSharedLink = false;
            }
        }

        // Hàm hỗ trợ copy link vào Clipboard
        function copyToClipboard(text, btnEl) {
            const tempInput = document.createElement("input");
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            
            try {
                document.execCommand("copy");
                const originalHtml = btnEl.innerHTML;
                btnEl.innerHTML = '<i class="fas fa-check mr-1"></i> Đã copy';
                btnEl.classList.replace('text-green-600', 'text-white');
                btnEl.classList.replace('bg-green-50', 'bg-green-600');
                
                setTimeout(() => {
                    btnEl.innerHTML = originalHtml;
                    btnEl.classList.replace('text-white', 'text-green-600');
                    btnEl.classList.replace('bg-green-600', 'bg-green-50');
                }, 2000);
            } catch (err) {
                console.error('Lỗi khi copy: ', err);
            } finally {
                document.body.removeChild(tempInput);
            }
        }

        // --- FETCH DỮ LIỆU KHÁCH HÀNG ---
        async function fetchCustomers() {
            const loadingEl = document.getElementById('loading-customers');
            const listEl = document.getElementById('customer-list');
            const errorEl = document.getElementById('error-customers');
            const errorTextEl = document.getElementById('error-text-customers');
            const emptyEl = document.getElementById('empty-customers');

            loadingEl.classList.remove('hidden');
            listEl.classList.add('hidden');
            errorEl.classList.add('hidden');
            emptyEl.classList.add('hidden');
            listEl.innerHTML = ''; 

            const requestBody = {
                "Action": "Find",
                "Properties": {
                    "Locale": "vi-VN",
                    "Timezone": "Asia/Ho_Chi_Minh"
                },
                "Rows": []
            };

            try {
                const response = await fetch(CUSTOMER_API_URL, {
                    method: 'POST',
                    headers: {
                        'applicationAccessKey': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`Lỗi HTTP: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();

                if (data && Array.isArray(data) && data.length > 0) {
                    renderCustomers(data);
                    listEl.classList.remove('hidden');
                } else {
                    emptyEl.classList.remove('hidden');
                }

            } catch (error) {
                console.error("Lỗi khi fetch API Khách Hàng:", error);
                errorTextEl.textContent = error.message || 'Không thể tải danh sách khách hàng.';
                errorEl.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
            }
        }

        // Render dữ liệu khách hàng ra HTML
        function renderCustomers(customers) {
            const listEl = document.getElementById('customer-list');
            let htmlContent = '';

            // Lấy URL gốc hiện tại của web
            const baseUrl = window.location.origin + window.location.pathname;

            customers.forEach(customer => {
                const id = customer['id'] || customer['ID'] || 'N/A';
                const tenKH = customer['Tên khách hàng'] || 'Khách hàng chưa có tên';
                
                // Link Xem thử cục bộ
                const hrefLink = `#khachhang=${encodeURIComponent(tenKH)}`;
                // Link gửi khách hàng vĩnh viễn (dùng parameter ?kh=)
                const sharedUrl = `${baseUrl}?kh=${encodeURIComponent(tenKH)}`;

                htmlContent += `
                    <div class="bg-white rounded-lg shadow p-4 border border-gray-100 flex flex-col hover:shadow-md transition">
                        <div class="flex items-center space-x-4 mb-4">
                            <div class="bg-blue-100 text-blue-600 rounded-full h-12 w-12 flex-shrink-0 flex items-center justify-center font-bold text-lg">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="overflow-hidden">
                                <p class="font-bold text-gray-800 truncate" title="${tenKH}">${tenKH}</p>
                                <p class="text-xs text-gray-500">ID: ${id}</p>
                            </div>
                        </div>
                        <div class="mt-auto grid grid-cols-2 gap-2">
                            <a href="${hrefLink}" onclick="filterByCustomer('${tenKH}')" class="text-center block w-full bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white text-xs font-semibold py-2 rounded transition">
                                <i class="fas fa-eye mr-1"></i> Xem thử
                            </a>
                            <button onclick="copyToClipboard('${sharedUrl}', this)" class="text-center block w-full bg-green-50 text-green-600 hover:bg-green-600 hover:text-white text-xs font-semibold py-2 rounded transition">
                                <i class="fas fa-link mr-1"></i> Copy Link
                            </button>
                        </div>
                    </div>
                `;
            });

            listEl.innerHTML = htmlContent;
        }

        // Hàm gọi chung để tải dữ liệu cả 2 bảng
        function loadAllData() {
            checkUrlFilter(); // Kiểm tra url có yêu cầu lọc không
            fetchData();       // Tải bảng Sàn Gỗ
            
            if (isSharedLink) {
                // Đang trong chế độ Khách Hàng xem -> Giấu hẳn khu vực danh sách khách hàng đi
                document.getElementById('customer-section-container').classList.add('hidden');
            } else {
                // Chủ shop xem -> Hiển thị danh sách khách hàng để copy link
                fetchCustomers();
            }
        }

        // Lắng nghe thay đổi Link URL
        window.addEventListener('hashchange', () => {
            checkUrlFilter();
            if (allProducts.length > 0) applyCurrentFilter();
        });

        // Tự động chạy khi trang tải xong
        document.addEventListener('DOMContentLoaded', loadAllData);
    </script>
</body>
</html>

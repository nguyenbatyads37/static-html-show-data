/* JIU SELECT · refined visual system */
:root{--ink:#202724;--muted:#7e857f;--line:#e8ebe6;--bg:#f4f6f3;--paper:#fff;--wine:#7b2837;--wine-light:#f7edf0;--gold:#ad8650;--green:#386d59;--green-light:#edf5f0;--shadow:0 5px 22px #26332904}

/* Motion design: navigation, product presentation, feedback. */
:root{--ease-out:cubic-bezier(.2,.75,.25,1)}
.phone-brand.compact{font-family:serif;color:#9d8458;font-size:24px;letter-spacing:0;width:32px;text-align:center;font-weight:400}
.mobile-hero .btn svg.icon{position:static;width:12px;height:12px;transform:none;filter:none;flex-shrink:0}
.mobile-hero .btn{font-size:9px}
.motion-toggle{width:30px;height:30px;border-radius:50%;border:1px solid #e7eadf;background:#f9faf5;display:grid;place-items:center;color:#89927d;flex-shrink:0}
.motion-toggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.motion-toggle[aria-pressed=false]{color:#7b2837;background:#f9edf0;border-color:#ead4d8}
.motion-toggle:hover{border-color:#b19a6d;background:#f4efe4}
button{touch-action:manipulation}
.btn,.iconbtn,.actor-button,.mobile-product,.categories button,.nav-item,.quick-card,.profile-menu button,.mobile-shortcuts .round,.motion-toggle{transition:transform 220ms var(--ease-out),box-shadow 220ms ease,background-color 180ms ease,border-color 180ms ease,color 180ms ease}
.btn:not(:disabled):active,.actor-button:active,.quick-card:active{transform:scale(.97)}
.mobile-product:active{transform:scale(.97)}
.phone-nav button:active .icon{transform:scale(.87)}
.phone-nav .icon{transition:transform 180ms var(--ease-out)}
.phone-nav button.active:before{animation:indicator-in 340ms var(--ease-out)}
.btn .icon:last-child,.profile-menu button>.icon:last-child{transition:transform 220ms var(--ease-out)}
.btn:hover .icon:last-child,.profile-menu button:hover>.icon:last-child{transform:translateX(3px)}
.btn:focus-visible,.actor-button:focus-visible,.mobile-product:focus-visible,.motion-toggle:focus-visible{outline:2px solid #966e33;outline-offset:4px}
.view-enter .phone-body{animation:page-enter 430ms var(--ease-out) both}
.view-enter .workspace{animation:page-enter 450ms var(--ease-out) both}
.view-enter .client-intro{animation:aside-enter 680ms var(--ease-out) both}
.view-enter .client-help{animation:aside-enter 680ms 100ms var(--ease-out) both}
.view-enter .mobile-hero .hero-copy{animation:page-enter 700ms 80ms var(--ease-out) both}
.view-enter .mobile-product{animation:card-enter 560ms calc(var(--i,0)*65ms + 100ms) var(--ease-out) backwards}
.view-enter .kpi{animation:card-enter 500ms var(--ease-out) backwards}
.view-enter .kpi:nth-child(2){animation-delay:65ms}.view-enter .kpi:nth-child(3){animation-delay:130ms}.view-enter .kpi:nth-child(4){animation-delay:195ms}
.view-enter .chartbox svg rect{transform-box:fill-box;transform-origin:center bottom;animation:bar-grow 900ms 100ms var(--ease-out) backwards}
.view-enter .chartbox svg rect:nth-of-type(4n){animation-delay:180ms}
.view-enter .track span{transform-origin:left;animation:bar-grow-x 850ms 150ms var(--ease-out) backwards}
.view-enter .wallet-hero .balance{animation:balance-enter 650ms 130ms var(--ease-out) backwards}
.mobile-hero svg.bottle-art{animation:bottle-float 6s ease-in-out infinite;transform-origin:50% 65%;will-change:transform}
.mobile-hero:before{animation:halo-breathe 6s ease-in-out infinite}
.detail-art svg.bottle-art{animation:product-reveal 720ms var(--ease-out) both}
.scan-box .scan-line{width:60%;height:2px;top:25%;background:linear-gradient(90deg,transparent,#e6cb90,transparent);animation:qr-scan 2800ms ease-in-out infinite;box-shadow:0 3px 18px #dac18355}
.scan-corners{animation:scan-frame 2800ms ease-in-out infinite}
dialog[open]{animation:dialog-enter 260ms var(--ease-out) both}
dialog[open]::backdrop{animation:backdrop-enter 260ms ease both}
.toast{transition:opacity 250ms ease,transform 350ms var(--ease-out)}
.toast.show{animation:toast-enter 350ms var(--ease-out)}
.success-celebration{position:relative;animation:success-pop 600ms var(--ease-out) both}
.success-celebration:before,.success-celebration:after{content:'';position:absolute;inset:-8px;border:1px solid #87ad90;border-radius:50%;opacity:0;animation:success-ring 1s 180ms ease-out both}
.success-celebration:after{animation-delay:320ms}
.success-celebration .icon{width:28px;height:28px;stroke-dasharray:40;stroke-dashoffset:0;animation:check-draw 500ms 280ms ease backwards}
.redpacket{position:relative;overflow:hidden}
.redpacket:after{content:'';position:absolute;top:-10%;left:-60%;width:35%;height:130%;background:linear-gradient(90deg,transparent,#f3d9a50c,transparent);transform:rotate(20deg);pointer-events:none;animation:packet-sheen 1800ms 300ms var(--ease-out) both}
@media(hover:hover){.mobile-shortcuts button:hover .round{transform:translateY(-3px);background:#e9e5d7;box-shadow:0 5px 10px #615d3210}.product-art:hover svg.bottle-art{transform:translateY(-5px) rotate(-2deg)}.product-art svg.bottle-art{transition:transform 450ms var(--ease-out)}.actor-button:hover{transform:translateX(3px)}.quick-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #26332908}.redpacket:hover .gift-symbol{transform:rotate(-5deg)}.gift-symbol{transition:transform 450ms var(--ease-out)}}
@keyframes page-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes aside-enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes card-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bottle-float{0%,100%{transform:translateY(0) rotate(7deg)}50%{transform:translateY(-7px) rotate(4deg)}}
@keyframes halo-breathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
@keyframes product-reveal{from{opacity:0;transform:translateY(14px) rotate(-4deg) scale(.96)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
@keyframes qr-scan{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(112px);opacity:1}}
@keyframes scan-frame{0%,100%{border-color:#b39d6c55}50%{border-color:#e1c585cc}}
@keyframes dialog-enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes backdrop-enter{from{opacity:0}to{opacity:1}}
@keyframes toast-enter{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes bar-grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
@keyframes bar-grow-x{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
@keyframes indicator-in{from{opacity:.2;transform:scaleX(.4)}to{opacity:1;transform:scaleX(1)}}
@keyframes balance-enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes success-pop{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}

function qrAdmin(){let list=state.qrs.filter(q=>(qrFilter==='all'||q.status===qrFilter)&&[q.token,q.serial,q.batch].join(' ').toLowerCase().includes(adminSearch.toLowerCase()));const total=list.length;qrPage=Math.min(qrPage,Math.max(0,Math.ceil(total/10)-1));list=list.slice(qrPage*10,qrPage*10+10);return heading(t('QR và truy xuất','二维码与溯源'),t('Mỗi serial có một mã riêng. Lịch sử quét được theo dõi độc lập.','每瓶一个码 扫描记录独立管理。'),button(t('Tạo lô QR','批量生成'),'generate-qr','','','plus'))+`<div class="kpis">${kpi(t('Tổng mã trong demo','演示二维码'),number(state.qrs.length),t('Mã minh họa để thử luồng','示意码用于体验'),'qr')}${kpi(t('Đang hoạt động','已启用'),number(state.qrs.filter(q=>q.status==='active').length),t('Cho phép truy xuất','可查询'),'shield')}${kpi(t('Tổng lượt quét','扫描次数'),number(state.qrs.reduce((s,q)=>s+q.scans,0)),t('Cộng dồn dữ liệu mẫu','示例累计'),'eye')}${kpi(t('Mã đã khóa','已锁定'),number(state.qrs.filter(q=>q.status==='locked').length),t('Không phát thưởng quét','不发放扫码奖励'),'lock')}</div><div class="toolbar"><div class="search">${icon('search')}<input id="admin-search" data-search="admin" placeholder="${t('Token, serial hoặc lô…','编码、序列号或批次…')}" value="${esc(adminSearch)}"></div><select class="select" id="qr-filter"><option value="all">${t('Tất cả trạng thái','全部状态')}</option><option value="active" ${qrFilter==='active'?'selected':''}>${t('Hoạt động','已启用')}</option><option value="locked" ${qrFilter==='locked'?'selected':''}>${t('Đã khóa','已锁定')}</option></select><span class="spacer"></span>${button(t('Xuất CSV','导出CSV'),'export-qr','secondary','','download')}</div><div class="card"><div class="scroll"><table><thead><tr><th>${t('Mã QR và serial','二维码与序列号')}</th><th>${t('Sản phẩm và lô','商品与批次')}</th><th>${t('Lượt quét','扫码次数')}</th><th>${t('Trạng thái','状态')}</th><th>${t('Thao tác','操作')}</th></tr></thead><tbody>${list.map(q=>`<tr><td><div class="bold mono">${esc(q.token)}</div><div class="tiny muted mono" style="margin-top:5px">${esc(q.serial)}</div></td><td>${esc(pName(product(q.pid)))}<div class="tiny muted">${esc(q.batch)}</div></td><td>${q.scans} ${q.scans>10?'<span class="pill wine">'+t('Bất thường','异常')+'</span>':''}</td><td>${badge(q.status)}</td><td><div class="flex">${button(t('Tra cứu','查询'),'scan-token','secondary small',q.token)}${button(q.status==='active'?t('Khóa','锁定'):t('Mở khóa','解锁'),'toggle-qr','text small',q.id)}</div></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">${t('Không có mã phù hợp.','暂无匹配记录。')}</div></td></tr>`}</tbody></table></div><div class="table-footer"><span>${total?t('Hiển thị','显示')+' '+(qrPage*10+1)+'–'+Math.min(total,(qrPage+1)*10)+' / '+total:t('0 mã','0条记录')}</span><div class="flex"><button class="iconbtn" data-action="qr-prev" ${qrPage===0?'disabled':''} aria-label="${t('Trang trước','上一页')}">${icon('back')}</button><span>${qrPage+1}</span><button class="iconbtn" data-action="qr-next" ${((qrPage+1)*10>=total)?'disabled':''} aria-label="${t('Trang sau','下一页')}">${icon('chevron')}</button></div></div></div><div class="inline-note" style="margin-top:16px">${t('Các mã và hình QR trong file này là minh họa. Dùng nút Tra cứu hoặc nhập token trong màn hình Quét để thử hành trình.','文件中的编码和二维码图形仅供演示。请点击查询或输入编码体验流程。')}</div>`}

function traceContent(q,adminView=false){return `<div class="mobile-banner" style="background:${q.status==='active'?'var(--green-light)':'var(--wine-light)'};color:${q.status==='active'?'var(--green)':'var(--wine)'}">${icon(q.status==='active'?'shield':'lock')} ${q.status==='active'?t('Mã hợp lệ trong hệ thống demo','演示系统内有效编码'):t('Mã đã khóa · cần kiểm tra với đơn vị vận hành','编码已锁定 · 请联系运营核实')}</div><div class="table-product"><div class="mini-bottle" style="width:57px;height:74px">${bottle(product(q.pid),'trace')}</div><div><strong>${esc(pName(product(q.pid)))}</strong><div class="small muted" style="margin-top:6px">${product(q.pid).degree}° · ${product(q.pid).volume}ml</div></div></div><div class="trace-card"><h3 style="font-size:12px;margin:0 0 8px">${t('Thông tin truy xuất','溯源信息')}</h3>${[[t('Serial','序列号'),q.serial],[t('Lô sản phẩm','商品批次'),q.batch],[t('Token','编码'),q.token],[t('Lượt quét','扫码次数'),q.scans],[t('Nguồn dữ liệu','资料来源'),t('Hồ sơ do Admin duyệt','后台已审核资料')]].map(([a,b])=>`<div class="total-line" style="font-size:10px;gap:10px"><span class="muted">${a}</span><strong class="text-right">${esc(b)}</strong></div>`).join('')}</div><div class="trace-card"><h3 style="font-size:12px;margin:0">${t('Hành trình lô minh họa','示例批次记录')}</h3><div class="timeline"><div class="timeline-item"><strong>${t('Nhập lô vào hệ thống','批次入库')}</strong>01/10/2026 · ${t('Chứng từ nguồn hàng mẫu','示例来源资料')}</div><div class="timeline-item"><strong>${t('QR được kích hoạt','编码已启用')}</strong>01/10/2026 · Admin</div><div class="timeline-item"><strong>${t('Lượt tra cứu hiện tại','本次查询')}</strong>02/10/2026 · ${t('Kênh demo','演示渠道')}</div></div></div><p class="tiny muted" style="line-height:1.8">${t('Mã hợp lệ xác nhận dữ liệu thuộc hệ thống. QR có thể bị sao chép; kết quả này không phải bảo chứng hàng chính hãng.','有效编码仅代表系统内存在该资料。二维码可被复制，此结果不等同于正品保证。')}</p>${!adminView?button(t('Xem sản phẩm và mua','查看商品'),'mobile-product','block',q.pid,'arrow'):''}`}
function mobileTrace(){const q=state.qrs.find(q=>q.token===scanResult)||state.qrs.find(q=>q.pid===selected)||state.qrs[0];return `<div class="mobile-pad">${traceContent(q)}</div>`}

function exportCSV(rows,filename){const bom='\ufeff';const csv=bom+rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('Đã xuất dữ liệu CSV demo.','已导出演示CSV数据。'))}

case 'qr-next':qrPage++;render();break;
case 'register-broker':{if(currentBroker()){mobilePage='broker';render();break}modal(t('Đăng ký môi giới','申请成为推广员'),`<div class="field"><label class="form-label" for="b-name">${t('Tên thành viên mẫu','示例会员姓名')}</label><input class="input" id="b-name" maxlength="60" value="${actor==='buyer'?t('Lý Vĩ','李伟'):t('Vương Minh','王明')}"></div><div class="inline-note">${t('Môi giới một cấp. Hoa hồng từ giao dịch được giới thiệu trực tiếp; tự mua không có hoa hồng. Admin phải duyệt hồ sơ trước khi nhận thưởng.','单层推广，按直接推广成交获得佣金，自购不计佣。需由后台审核。')}</div><label class="flex small" style="margin-top:18px"><input type="checkbox" id="b-consent">${t('Tôi đồng ý chính sách môi giới mẫu của demo.','我同意演示推广规则。')}</label>`,button(t('Hủy','取消'),'close','secondary')+button(t('Gửi đăng ký demo','提交模拟申请'),'submit-broker'));break}
case 'submit-broker':{if(currentBroker()){close();break}const name=document.getElementById('b-name').value.trim(),consent=document.getElementById('b-consent').checked;if(!name||!consent){toast(t('Điền tên và xác nhận chính sách mẫu.','请填写姓名并同意示例规则。'));break}state.brokers.push({id:'b'+Date.now(),user:actor,name,zh:name,code:'B'+String(187+state.brokers.length-1).padStart(6,'0'),status:'pending',phone:'DEMO'});log('Nhận đăng ký môi giới '+name);close();mobilePage='broker';render();toast(t('Đã gửi hồ sơ. Duyệt tại Web Admin.','申请已提交，请在后台审核。'));break}
case 'approve-broker':{const b=broker(arg);if(!b||b.status!=='pending')break;b.status='active';log('Duyệt môi giới '+b.code);render();toast(t('Môi giới đã được duyệt.','推广员审核通过。'));break}
case 'broker-detail':{const b=broker(arg);if(!b)break;modal(t('Hồ sơ môi giới','推广员资料'),`<p><strong>${esc(brokerName(arg))}</strong> · ${esc(b.code)}</p>${badge(b.status)}<div class="divider"></div><div class="total-line"><span>${t('Hoa hồng khả dụng','可用佣金')}</span><strong>${money(available(arg))}</strong></div><div class="total-line"><span>${t('Hoa hồng chờ duyệt','待释放佣金')}</span><strong>${money(pending(arg))}</strong></div><div class="total-line"><span>${t('Đang giữ chỗ rút','提现冻结')}</span><strong>${money(holds(arg))}</strong></div>`);break}
case 'edit-rule':{const p=product(arg);modal(t('Cập nhật tỷ lệ hoa hồng','编辑佣金比例'),`<p><strong>${esc(pName(p))}</strong></p><div class="field"><label class="form-label" for="rule-rate">${t('Tỷ lệ 0–100 %','比例 0–100 %')}</label><input class="input" id="rule-rate" type="number" min="0" max="100" step="0.1" value="${p.rate}"></div><div class="inline-note">${t('Áp dụng cho đơn tạo mới. Đơn cũ giữ tỷ lệ đã lưu.','仅用于新订单，历史订单保留原比例。')}</div>`,button(t('Hủy','取消'),'close','secondary')+button(t('Lưu phiên bản mới','保存新版本'),'save-rule','',p.id));break}
case 'save-rule':{const rate=Number(document.getElementById('rule-rate').value);if(!Number.isFinite(rate)||rate<0||rate>100){toast(t('Tỷ lệ phải từ 0 đến 100.','比例须为0至100。'));break}product(arg).rate=rate;state.ruleVersion++;log('Cập nhật chính sách thưởng phiên bản '+state.ruleVersion);close();render();break}
case 'withdraw':withdrawalForm(arg);break;
case 'request-withdraw':{const b=broker(arg),value=document.getElementById('w-amount').value,amount=Math.round(Number(value)*100);if(!value||!Number.isFinite(amount)||amount<1000||amount>50000||!b||b.status!=='active'||amount>available(arg)){toast(t('Số tiền phải từ ¥10–¥500 và không vượt khả dụng.','金额须为¥10至¥500且不超过可用余额。'));break}const id='WC261002'+String(state.withdrawalSeq++).padStart(3,'0');state.withdrawals.unshift({id,broker:arg,amount,status:'requested',date:today});log('Giữ chỗ yêu cầu rút '+id);close();render();toast(t('Đã giữ chỗ số tiền. Chờ Admin duyệt.','已冻结金额，等待后台审核。'));break}
case 'payout-confirm':{const w=state.withdrawals.find(w=>w.id===arg);if(!w||w.status!=='requested')break;modal(t('Duyệt chi mô phỏng','批准模拟支付'),`<p><strong>${esc(brokerName(w.broker))}</strong> · ${esc(w.id)}</p><div class="total-line big"><span>${t('Số tiền','金额')}</span><strong>${money(w.amount)}</strong></div><div class="inline-note" style="margin-top:15px">${t('Nút xác nhận chỉ mô phỏng kết quả WeChat thành công và ghi sổ ví. Không chuyển tiền thật.','确认按钮仅模拟微信支付成功并更新账本，不产生真实转账。')}</div>`,button(t('Hủy','取消'),'close','secondary')+button(t('Xác nhận đã chi demo','确认模拟支付'),'payout','',arg));break}
case 'payout':{const w=state.withdrawals.find(w=>w.id===arg);if(!w||w.status!=='requested'){close();break}w.status='paid';if(!state.entries.some(e=>e.id==='payout-'+arg))state.entries.push({id:'payout-'+arg,broker:w.broker,amount:-w.amount,type:'payout',desc:'Rút tiền '+arg,date:today});log('Đã chi mô phỏng '+arg);close();render();toast(t('Đã ghi chi mô phỏng. Không có chuyển tiền thật.','模拟支付已记账，无真实转账。'));break}
case 'reject-confirm':modal(t('Từ chối yêu cầu rút','拒绝提现申请'),`<div class="field"><label class="form-label" for="reject-reason">${t('Lý do','原因')}</label><textarea class="input" id="reject-reason" maxlength="250" rows="3">${t('Cần kiểm tra lại thông tin nhận tiền mẫu.','需核实示例收款信息。')}</textarea></div><p class="small muted">${t('Tiền giữ chỗ sẽ được trả về số dư khả dụng.','冻结金额将恢复为可用余额。')}</p>`,button(t('Hủy','取消'),'close','secondary')+button(t('Từ chối trong demo','拒绝模拟申请'),'reject','',arg));break;
case 'reject':{const w=state.withdrawals.find(w=>w.id===arg),reason=document.getElementById('reject-reason').value.trim();if(!w||w.status!=='requested'){close();break}if(!reason){toast(t('Vui lòng nhập lý do.','请填写原因。'));break}w.status='rejected';w.reason=reason;log('Từ chối yêu cầu rút '+arg);close();render();toast(t('Đã giải phóng giữ chỗ.','冻结金额已释放。'));break}
case 'withdraw-detail':{const w=state.withdrawals.find(w=>w.id===arg);if(!w)break;modal(t('Chi tiết yêu cầu rút','提现申请详情'),`<p class="mono">${esc(w.id)}</p><div class="total-line"><span>${t('Thành viên','推广员')}</span><strong>${esc(brokerName(w.broker))}</strong></div><div class="total-line"><span>${t('Số tiền','金额')}</span><strong>${money(w.amount)}</strong></div><div class="total-line"><span>${t('Trạng thái','状态')}</span>${w.status==='paid'?t('Đã chi mô phỏng','模拟已支付'):badge(w.status)}</div>${w.reason?`<p class="small muted">${esc(w.reason)}</p>`:''}<div class="inline-note" style="margin-top:16px">WeChat · DEMO · ${t('Không chuyển tiền thật','无真实转账')}</div>`);break}
case 'claim-gift':{const b=broker(arg);if(!b||b.status!=='active'||state.claims.includes(arg)){toast(t('Không còn đủ điều kiện nhận.','当前不符合领取条件。'));break}if(state.claims.length*500+500>state.redpacketBudget){toast(t('Chương trình đã hết ngân sách.','活动预算已用完。'));break}state.claims.push(arg);state.entries.push({id:'gift-'+arg,broker:arg,amount:500,type:'redpacket',desc:'Hồng bao thành viên demo',date:today});log('Phát hồng bao cho '+b.code);render();toast(t('Đã cộng ¥5.00 vào ví demo.','演示钱包已增加¥5.00。'));break}
case 'copy-referral':{const b=broker(arg);modal(t('Thông tin giới thiệu','推广信息'),`<p>${t('Môi giới','推广员')}: <strong>${esc(brokerName(arg))} · ${esc(b.code)}</strong></p><div class="inline-note mono">DEMO / product / ${esc(selected)}?r=${esc(b.code)}</div><p class="small muted">${t('Đây là định dạng minh họa. Dùng nút Thử vai khách được giới thiệu trong màn hình để tạo đơn mẫu.','这是演示格式，请使用页面上的体验推广买家按钮创建示例订单。')}</p>`);break}
case 'buyer-referral':referralSource=currentBroker()?.id||'b1';actor='buyer';mobilePage='product';quantity=1;render();break;
case 'address':modal(t('Địa chỉ mẫu','示例地址'),`<p><strong>${actor==='buyer'?t('Lý Vĩ','李伟'):t('Vương Minh','王明')}</strong></p><p class="small muted">${t('Địa chỉ giao hàng mẫu tại Thượng Hải, Trung Quốc. Có thể sửa nội dung mẫu tại bước đặt mua.','中国上海市示例收货地址。可以在下单步骤修改示例内容。')}</p>`);break;
case 'export':exportCSV([['Order ID','Product','Customer','Quantity','Revenue CNY','Broker','Commission CNY','Status','Revenue confirmed'],...state.orders.map(o=>[o.id,orderProduct(o).name,o.customer,o.qty,(o.total/100).toFixed(2),brokerName(o.broker),(o.commission/100).toFixed(2),o.status,o.settled?'Yes':'No'])],'jiu_select_orders_demo.csv');break;
case 'export-qr':exportCSV([['Token DEMO','Serial','Product','Batch','Status','Scans'],...state.qrs.map(q=>[q.token,q.serial,product(q.pid).name,q.batch,q.status,q.scans])],'jiu_select_qr_demo.csv');break;
case 'reset-confirm':modal(t('Khôi phục dữ liệu mẫu','恢复示例数据'),`<p>${t('Xóa đơn, sản phẩm, QR và giao dịch bạn đã thêm trong demo rồi khôi phục dữ liệu ban đầu? Chỉ ảnh hưởng file demo này.','清除本演示中新建的订单、商品、编码和交易并恢复初始数据？仅影响本演示。')}</p>`,button(t('Giữ dữ liệu','保留数据'),'close','secondary')+button(t('Khôi phục','恢复'),'reset'));break;
case 'reset':state=initial();for(const o of state.orders){const p=product(o.pid);o.snapshot={name:p.name,zh:p.zh,volume:p.volume,degree:p.degree,brand:p.brand,color:p.color,code:p.code};}save();close();adminPage='dashboard';adminSearch='';orderFilter='all';qrFilter='all';qrPage=0;quantity=1;selected='p1';productSearch='';category='all';actor='buyer';referralSource='b1';mobilePage='home';render();toast(t('Đã khôi phục dữ liệu mẫu.','示例数据已恢复。'));break;
}});

// Local, restrained pointer lighting. No motion on touch or reduced-motion devices.
function luxuryPointerAllowed(){return motionEnabled&&typeof matchMedia==='function'&&matchMedia('(hover: hover) and (pointer: fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches;}
function resetLuxuryPointer(surface){if(!surface)return;for(const name of ['--tilt-x','--tilt-y','--spot-x','--spot-y'])surface.style.removeProperty(name);}
document.addEventListener('pointermove',e=>{if(!luxuryPointerAllowed())return;const surface=e.target.closest?.('.mobile-hero');if(!surface)return;const bounds=surface.getBoundingClientRect();if(!bounds.width||!bounds.height)return;const x=Math.max(0,Math.min(1,(e.clientX-bounds.left)/bounds.width)),y=Math.max(0,Math.min(1,(e.clientY-bounds.top)/bounds.height));surface.style.setProperty('--tilt-x',((x-.5)*3).toFixed(2)+'deg');surface.style.setProperty('--tilt-y',((.5-y)*2).toFixed(2)+'deg');surface.style.setProperty('--spot-x',(55+x*25).toFixed(1)+'%');surface.style.setProperty('--spot-y',(15+y*35).toFixed(1)+'%');},{passive:true});
document.addEventListener('pointerout',e=>{const surface=e.target.closest?.('.mobile-hero');if(surface&&!surface.contains(e.relatedTarget))resetLuxuryPointer(surface);},{passive:true});
document.addEventListener('pointercancel',e=>resetLuxuryPointer(e.target.closest?.('.mobile-hero')),{passive:true});

document.addEventListener('change',e=>{if(e.target.id==='order-filter'){orderFilter=e.target.value;render()}if(e.target.id==='qr-filter'){qrFilter=e.target.value;qrPage=0;render()}if(e.target.id==='referral-product'){selected=e.target.value;render()}});
document.addEventListener('input',e=>{if(!e.target.dataset.search)return;const kind=e.target.dataset.search,id=e.target.id,start=e.target.selectionStart,end=e.target.selectionEnd;if(kind==='admin'){adminSearch=e.target.value;qrPage=0}else productSearch=e.target.value;const body=document.getElementById('phone-body'),scrollTop=body?.scrollTop||0;render();const input=document.getElementById(id);input?.focus({preventScroll:true});input?.setSelectionRange(start,end);if(body&&document.getElementById('phone-body'))document.getElementById('phone-body').scrollTop=scrollTop});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
for(const o of state.orders){if(!o.snapshot){const p=product(o.pid);o.snapshot={name:p.name,zh:p.zh,volume:p.volume,degree:p.degree,brand:p.brand,color:p.color,code:p.code};}}
render();
</script>
